<!DOCTYPE html>
<html lang="en" data-theme-pending>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Nagare — Kanban flow management: upstream/downstream boards, WIP policies, flow metrics and probabilistic forecasting.">
<title>Nagare</title>

<!-- Inline SVG favicon: three flow lines over the accent. No external request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B6B78'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M7 11c3-2.6 6-2.6 9 0s6 2.6 9 0'/%3E%3Cpath d='M7 17c3-2.6 6-2.6 9 0s6 2.6 9 0'/%3E%3Cpath d='M7 23c3-2.6 6-2.6 9 0s6 2.6 9 0'/%3E%3C/g%3E%3C/svg%3E">

<!--
  No-FOUC theme bootstrap. This MUST run before the first paint and before the
  stylesheets resolve, otherwise a dark-theme user gets a white flash on every
  navigation. It only stamps the attribute; tokens.css owns every colour.
-->
<script>
(function () {
  try {
    var stored = localStorage.getItem("nagare.theme");
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
  } catch (e) {
    /* private mode / storage disabled — fall through to the OS preference */
  }
  document.documentElement.removeAttribute("data-theme-pending");
})();
</script>

<!--
  Critical paint colours only. Duplicated from tokens.css on purpose: these few
  declarations are what stand between the user and a white flash while the real
  stylesheet is still in flight.
-->
<style>
  :root { --boot-bg: #FBFAF8; --boot-fg: #1A1917; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --boot-bg: #101315; --boot-fg: #EDECEA; }
  }
  :root[data-theme="dark"] { --boot-bg: #101315; --boot-fg: #EDECEA; }
  html { background: var(--boot-bg); }
  body { background: var(--boot-bg); color: var(--boot-fg); margin: 0; }
  /* Hide the shell until app.js has hydrated it, so half-built chrome never shows. */
  .app[hidden] { display: none !important; }
</style>

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/board.css">
<link rel="stylesheet" href="/css/structure.css">
<link rel="stylesheet" href="/css/metrics.css">
<link rel="stylesheet" href="/css/views.css">
</head>

<body>

<a class="skip-link" href="#view">Skip to content</a>

<div class="app" id="app">

  <!-- ==================================================================
       LEFT RAIL
       hrefs are placeholders resolved by app.js once the board list loads.
       =================================================================== -->
  <nav class="rail" id="rail" aria-label="Primary">

    <div class="rail-head">
      <a class="wordmark" href="#/" aria-label="Nagare — home">
        <span class="wordmark-glyph" aria-hidden="true">流</span>
        <span class="wordmark-text">Nagare</span>
      </a>
    </div>

    <div class="rail-nav">

      <div class="rail-section">
        <div class="rail-section-label">Flow</div>

        <a class="rail-item" data-nav="board" aria-label="Boards" href="#/board">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="5.5" height="16" rx="1.5"/>
            <rect x="9.25" y="4" width="5.5" height="11" rx="1.5"/>
            <rect x="15.5" y="4" width="5.5" height="14" rx="1.5"/>
          </svg>
          <span class="rail-label">Boards</span>
          <span class="rail-lock" hidden></span>
        </a>

        <a class="rail-item" data-nav="projects" aria-label="Projects" href="#/projects">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 3 8.5 4.5L12 12 3.5 7.5 12 3Z"/>
            <path d="m3.5 12 8.5 4.5 8.5-4.5"/>
            <path d="m3.5 16.5 8.5 4.5 8.5-4.5"/>
          </svg>
          <span class="rail-label">Projects</span>
          <span class="rail-lock" hidden></span>
        </a>
      </div>

      <div class="rail-section">
        <div class="rail-section-label">Insight</div>

        <a class="rail-item" data-nav="metrics" aria-label="Metrics" href="#/metrics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 20.5h17"/>
            <path d="M6.5 20.5v-6"/>
            <path d="M11 20.5V8"/>
            <path d="M15.5 20.5v-9"/>
            <path d="M20 20.5V4.5"/>
          </svg>
          <span class="rail-label">Metrics</span>
          <span class="rail-lock" hidden></span>
        </a>

        <a class="rail-item" data-nav="simulator" aria-label="Simulator" href="#/simulator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.5 3v5.2L4.7 17a2.2 2.2 0 0 0 1.9 3.3h10.8a2.2 2.2 0 0 0 1.9-3.3L14.5 8.2V3"/>
            <path d="M8.5 3h7"/>
            <path d="M7.4 14.2h9.2"/>
          </svg>
          <span class="rail-label">Simulator</span>
          <span class="rail-lock" hidden></span>
        </a>
      </div>

      <div class="rail-section">
        <div class="rail-section-label">Workspace</div>

        <a class="rail-item" data-nav="admin" aria-label="Admin" href="#/admin/users">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16.5 20v-1.6a3.4 3.4 0 0 0-3.4-3.4H6.9a3.4 3.4 0 0 0-3.4 3.4V20"/>
            <circle cx="10" cy="7.6" r="3.1"/>
            <path d="M20.5 20v-1.6a3.4 3.4 0 0 0-2.6-3.3"/>
            <path d="M15.6 4.7a3.4 3.4 0 0 1 0 6.1"/>
          </svg>
          <span class="rail-label">Admin</span>
          <span class="rail-lock" hidden></span>
        </a>
      </div>

    </div>

    <div class="rail-foot" id="rail-foot"></div>
  </nav>

  <!-- ==================================================================
       MAIN — top bar + routed view
       =================================================================== -->
  <div class="app-main">

    <header class="topbar" id="topbar">
      <!-- Board switcher (populated by app.js) -->
      <div id="board-switcher-slot"></div>

      <!-- Segment switcher: upstream / downstream / unified (Req. 1) -->
      <div id="segment-slot"></div>

      <!-- Filter bar portal — owned by the BOARD agent's filters.js -->
      <div id="filter-slot"></div>

      <div class="spacer"></div>

      <!-- Search -->
      <div class="input-group topbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10.75" cy="10.75" r="6.25"/><path d="m19.5 19.5-4.3-4.3"/>
        </svg>
        <input class="input input-sm" id="global-search" type="search" placeholder="Search cards" aria-label="Search cards" autocomplete="off">
        <kbd class="kbd">/</kbd>
      </div>

      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <main id="view" tabindex="-1"></main>
  </div>

</div>

<!-- ======================================================================
     PORTALS — overlays mount here so no view can clip or stack over them.
     ====================================================================== -->
<div id="drawer-portal"></div>
<div id="modal-portal"></div>
<div class="toast-region" id="toast-portal" role="region" aria-label="Notifications"></div>

<!-- Polite announcements for screen readers (route changes, async results). -->
<div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<noscript>
  <div style="padding:2rem;font-family:system-ui,sans-serif;max-width:52ch;margin:0 auto">
    <h1>JavaScript is required</h1>
    <p>Nagare renders boards, metrics and forecasts in the browser. Enable JavaScript to continue.</p>
  </div>
</noscript>

<script type="module" src="/js/app.js"></script>

</body>
</html>
