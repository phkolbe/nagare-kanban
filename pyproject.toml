[project]
name = "nagare-kanban"
version = "2.0.0.dev0"
description = "Nagare Kanban: gestao de fluxo (upstream/downstream, WIP, metricas, previsao), integrado a plataforma Pampufa por API"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietario" }
authors = [{ name = "Paulo Kolbe", email = "paulo.kolbe@gmail.com" }]

# O pampufa-sdk entra so como biblioteca (validacao do token pela JWKS e uuid7);
# o Nagare nao e um servico da Pampufa (decisao NG1, cofre pampufa-plataforma/integracao-nagare.md).
dependencies = [
    "pampufa-sdk",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]
# Capturas de tela e verificacoes visuais da tela antiga (tools/).
qa = ["playwright>=1.44"]

[project.scripts]
nagare = "backend.app.cli:main"

[tool.uv.sources]
# SDK fixado por tag. Para evoluir o SDK junto, troque temporariamente por
# { path = "../pampufa-sdk", editable = true } e NAO commite essa troca.
pampufa-sdk = { git = "https://github.com/phkolbe/pampufa-sdk", tag = "v0.12.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "tests"]
extend-exclude = ["frontend", "docs", "refs", "compare", "shots"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*" = ["E501"]
# Codigo herdado do Nagare v1 que a N1 nao reescreveu (textos longos, algoritmos de
# previsao, MCP e ferramentas de QA); o comportamento esta coberto pelos testes.
"backend/app/config.py" = ["E501"]
"backend/app/flow/*" = ["E501", "B007", "F841", "SIM102"]
"mcp/*" = ["E501", "SIM105"]
"tools/*" = ["E501", "SIM105", "B007", "RUF015", "E741"]
"run.py" = ["SIM105"]
# Modelos pydantic: o pydantic copia o default de cada instancia.
"backend/app/routers/{flags,movements}.py" = ["RUF012"]
