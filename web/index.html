<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Tarefas · Grupo SR</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B6B78'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M7 11c3-2.6 6-2.6 9 0s6 2.6 9 0'/%3E%3Cpath d='M7 17c3-2.6 6-2.6 9 0s6 2.6 9 0'/%3E%3Cpath d='M7 23c3-2.6 6-2.6 9 0s6 2.6 9 0'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // Nagare fora da plataforma: o tema antes da primeira pintura (sem piscar). Na Pampufa, claro.
      ;(function () {
        if (location.pathname.indexOf('/grupo-sr') === 0) return
        document.title = 'Nagare Kanban'
        document.documentElement.lang = 'en'
        var tema = 'system'
        try {
          tema = localStorage.getItem('nagare.theme') || 'system'
        } catch (e) {}
        var escuro = tema === 'dark' || (tema === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = escuro ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <a class="visualmente-oculto" href="#conteudo">Pular para o conteúdo</a>
    <noscript>O Nagare precisa de JavaScript. / Nagare needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
